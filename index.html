<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Åbningstider</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tabletop@1.6.0/src/tabletop.min.js"></script>
</head>
<body>
  <section class="openinghours">
    <div class="openinghourscontent section">
      <div class="header">
        <h2>Åbningstider</h2>
        <span id="open-status"><small class="openorclosed">Butikken er</small></span>
      </div>
      <table class="opening-hours-table">
        <tr id="Mandag" itemprop="openingHours" title="Åben Mandag">
          <td>Mandag</td>
          <td class="opens">--:--</td>
          <td>-</td>
          <td class="closes">--:--</td>
        </tr>
        <tr id="Tirsdag" itemprop="openingHours" title="Åben Tirsdag">
          <td>Tirsdag</td>
          <td class="opens">--:--</td>
          <td>-</td>
          <td class="closes">--:--</td>
        </tr>
        <tr id="Onsdag" itemprop="openingHours" title="Åben Onsdag">
          <td>Onsdag</td>
          <td class="opens">--:--</td>
          <td>-</td>
          <td class="closes">--:--</td>
        </tr>
        <tr id="Torsdag" itemprop="openingHours" title="Åben Torsdag">
          <td>Torsdag</td>
          <td class="opens">--:--</td>
          <td>-</td>
          <td class="closes">--:--</td>
        </tr>
        <tr id="Fredag" itemprop="openingHours" title="Åben Fredag">
          <td>Fredag</td>
          <td class="opens">--:--</td>
          <td>-</td>
          <td class="closes">--:--</td>
        </tr>
        <tr id="Lørdag" itemprop="openingHours" title="Åben Lørdag">
          <td>Lørdag</td>
          <td class="opens">--:--</td>
          <td>-</td>
          <td class="closes">--:--</td>
        </tr>
        <tr id="Søndag" itemprop="openingHours" title="Åben Søndag">
          <td>Søndag</td>
          <td class="opens">--:--</td>
          <td>-</td>
          <td class="closes">--:--</td>
        </tr>
      </table>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
